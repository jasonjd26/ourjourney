<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jason & Ciara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15110c;--bg2:#1b1610;--card:#201a12;--card2:#2a2218;--line:#3a2f22;
  --txt:#f3ebdd;--mut:#b6a890;--mut2:#7d705c;
  --coral:#d9763e;--amber:#e6a43c;--teal:#7fbf98;--teal2:#4f9e74;--rose:#d4604f;
  --display:"Rye",Georgia,serif; --slab:"Zilla Slab",Georgia,serif;
  --star:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:560px;margin:0 auto;padding-bottom:92px;position:relative}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.muted{color:var(--mut)}.ctr{text-align:center}.sm{font-size:11.5px}.sm2{font-size:11px}.wide{width:100%}

/* header */
header{position:relative;padding:20px 18px 18px;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(120% 85% at 80% -10%,rgba(217,118,62,.22),transparent 60%),linear-gradient(180deg,#271c11,#15110c)}
.hd-top{display:flex;align-items:center;justify-content:space-between}
.names{font-family:var(--display);font-size:23px;font-weight:400;letter-spacing:.5px;line-height:1.1;color:var(--txt);text-shadow:0 2px 10px rgba(0,0,0,.4)}
.amp{background:linear-gradient(90deg,var(--coral),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 1px}
.gear{display:flex;align-items:center;gap:7px;font-size:17px;opacity:.9;padding:4px 6px}
.ridge{display:block;width:100%;height:58px;margin:10px 0 2px}
.cd{text-align:center;margin-top:8px}
.cd-cap{font-family:var(--slab);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);font-weight:600}
.cd-row{display:flex;justify-content:center;gap:10px;margin-top:9px}
.cd-cell{min-width:54px}
.cd-n{font-family:var(--slab);font-size:30px;font-weight:700;line-height:1;color:var(--txt)}
.cd-l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut2);margin-top:4px}
.cd-done{font-family:var(--slab);font-size:31px;font-weight:700;background:linear-gradient(90deg,var(--coral),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;
  background:rgba(21,17,12,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--mut);transition:.15s}
.tab .ic{font-size:18px;font-weight:700}
.tab .lb{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.tab.active{color:var(--txt);background:var(--card2)}
.tab.active .ic{color:var(--amber)}
.tab.active .lb{color:var(--amber)}

/* panels + cards */
main{padding:16px 16px 4px}
.panel{display:none}.panel.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.card-h .e{font-size:17px}
.card-h h2{font-family:var(--slab);font-size:15px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--txt)}

/* stats */
.stats{display:flex;gap:10px;margin-bottom:13px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.stat .v{font-family:var(--slab);font-size:24px;font-weight:700}
.stat .v.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:21px}
.stat .l{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-top:3px}
.bar{height:6px;border-radius:6px;background:#0f0c08;overflow:hidden;margin-top:9px;border:1px solid var(--line)}
.bar.big{height:10px;margin:12px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--amber));transition:.4s}

/* focus */
.focus-show{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;line-height:1.5;cursor:text;min-height:24px}
.focus-show .edit-hint{margin-left:auto;font-size:10px;color:var(--mut2);white-space:nowrap;padding-top:3px}
.focus textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;min-height:64px;resize:vertical}

/* vs */
.vs{display:flex;align-items:center;gap:8px}
.vs-side{flex:1;text-align:center}
.vs-name{font-size:12px;color:var(--mut);font-weight:700}
.vs-num{font-family:var(--slab);font-size:32px;font-weight:700;margin-top:2px}
.vs-num span{font-size:14px;color:var(--mut2);font-weight:700}
.vs-mid{font-family:var(--display);font-size:13px;color:var(--coral)}
.vs-side .bar{margin-top:8px}

/* next */
.next-li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.next-li:first-of-type{border-top:none}
.dot2{width:13px;height:13px;background:var(--amber);flex-shrink:0;clip-path:var(--star)}

/* checklist / items */
.phase{display:flex;align-items:center;gap:9px;font-family:var(--slab);font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--coral);margin:0 2px 10px}
.phase .dot{width:14px;height:14px;background:var(--coral);clip-path:var(--star)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.box{width:23px;height:23px;border-radius:7px;border:2px solid var(--mut2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;transition:.12s;margin-top:1px;cursor:pointer}
.box.on{background:linear-gradient(135deg,var(--coral),var(--amber));border-color:transparent;color:#2a1400}
.it-body{flex:1}
.it-t{font-weight:700;font-size:14px;transition:.12s}
.it-d{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.5}
.item.done .it-t{color:var(--mut2);text-decoration:line-through}
.by{font-size:11px;color:var(--teal);margin-top:5px;font-weight:600}
.tag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--amber);background:rgba(230,164,60,.16);padding:2px 7px;border-radius:20px;vertical-align:middle}

/* keybox */
.keybox{background:linear-gradient(180deg,rgba(230,164,60,.10),rgba(127,191,152,.05));border:1px solid rgba(230,164,60,.28);border-radius:16px;padding:14px;margin-bottom:13px}
.keybox h3{font-family:var(--slab);font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--amber);margin-bottom:7px}
.keybox p{margin:6px 0 0;font-size:13px;color:#efe7d8;line-height:1.5}
.keybox b{color:var(--amber)}

/* fields */
.field{margin-bottom:9px}
.flab{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px}
.row2{display:flex;gap:9px}.row2>*{flex:1;margin-bottom:9px}

/* buttons */
.btn{padding:13px;border-radius:12px;font-weight:800;font-size:13.5px;letter-spacing:.3px;transition:.12s;border:1px solid var(--line);width:100%}
.btn:active{transform:scale(.98)}
.btn-go{background:linear-gradient(135deg,var(--coral),var(--amber));color:#2a1400;border:none}
.btn-ghost{background:var(--card2);color:var(--txt)}
.mini{padding:10px;border-radius:10px;font-weight:700;font-size:12px;background:var(--card2);border:1px solid var(--line)}

/* segmented */
.seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}
.seg.sm{padding:3px;gap:4px}.seg.sm button{padding:5px 12px;flex:initial}
.seg.sm button.on{background:linear-gradient(135deg,var(--coral),var(--amber));color:#2a1400}
.goalpick{display:flex;align-items:center;gap:7px}
.tiny{width:46px;text-align:center;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px}

/* records */
.rec{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:none}
.rec-main{flex:1;min-width:0}
.rec-t{font-weight:700;font-size:14px}
.rec-sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.rec-amt{font-weight:800;font-size:14px}
.rec-x{color:var(--mut2);font-size:16px;padding:2px 4px;flex-shrink:0}
.tagc{color:var(--amber);font-weight:700}

/* settle */
.settle{background:linear-gradient(180deg,rgba(127,191,152,.09),transparent);border-color:rgba(127,191,152,.26)}
.settle-ok{font-weight:800;font-size:15px;text-align:center;color:var(--teal)}
.settle-amt{font-family:var(--slab);font-size:22px;font-weight:700;color:var(--teal)}
.settle-tx{font-size:14px;font-weight:600}

/* adventures hero */
.hero-adv{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(217,118,62,.20),rgba(230,164,60,.07));border-color:rgba(217,118,62,.30)}
.hero-adv h2{font-family:var(--display);font-size:21px;font-weight:400;line-height:1.2;color:var(--txt)}
.hero-adv p{margin:9px 0 0;font-size:13.5px;color:#efe7d8;line-height:1.5}
.hero-sun{position:absolute;top:-28px;right:-12px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle,var(--amber),transparent 70%);opacity:.55}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.idea{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:700}
.idea.added{border-color:rgba(127,191,152,.45);color:var(--teal)}
.idea-add{color:var(--amber);font-weight:800}
.idea.added .idea-add{color:var(--teal)}

/* who overlay */
.who{position:fixed;inset:0;background:radial-gradient(120% 60% at 50% 0,rgba(217,118,62,.18),transparent 60%),linear-gradient(180deg,#271c11,#15110c);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.who-card{max-width:360px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px}
.who-sun{width:62px;height:62px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle,var(--amber),var(--coral) 72%);box-shadow:0 0 44px rgba(217,118,62,.45)}
.who-card h2{font-family:var(--display);font-size:21px;font-weight:400}
.who-card p{color:var(--mut);font-size:13.5px;margin:9px 0 18px;line-height:1.5}
.who-btns{display:flex;gap:10px}.who-btns .btn{flex:1}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,4,.62);display:flex;align-items:flex-end;justify-content:center;z-index:90;backdrop-filter:blur(3px)}
.modal-card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:rise .2s}
@keyframes rise{from{transform:translateY(30px)}to{transform:none}}
.syncbox{display:flex;align-items:center;gap:9px;font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px}

/* sync dot (stays round) */
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2);display:inline-block}
.dot.ok{background:var(--teal2)}.dot.sync{background:var(--amber)}.dot.err{background:var(--rose)}.dot.local{background:var(--mut)}

/* toast */
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(18px);background:#2a2218;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
