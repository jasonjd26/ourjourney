<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yeehaw">
<meta name="theme-color" content="#15110c">
<title>Yeehaw — Jason &amp; Ciara</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15110c; --bg2:#1b1610; --card:#201a12; --card2:#2a2218; --line:#3a2f22;
  --txt:#f3ebdd; --mut:#b6a890; --mut2:#7d705c;
  --coral:#d9763e; --amber:#e6a43c; --teal:#7fbf98; --teal2:#4f9e74; --rose:#d4604f;
  --jason:#e6a43c; --ciara:#7fbf98;
  --display:"Rye",Georgia,serif; --slab:"Zilla Slab",Georgia,serif;
  --star:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:var(--slab),-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative}
.muted{color:var(--mut)} .ctr{text-align:center}

/* ===== header ===== */
header{position:sticky;top:0;z-index:40;padding:14px 18px 12px;
  background:rgba(21,17,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-size:21px;font-weight:400;letter-spacing:.3px}
.brand .amp{background:linear-gradient(90deg,var(--coral),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 1px}
.hdr-right{display:flex;align-items:center;gap:14px}
.syncpill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--mut);
  background:var(--card2);border:1px solid var(--line);padding:5px 9px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2);display:inline-block;flex-shrink:0}
.dot.ok{background:var(--teal2)} .dot.sync{background:var(--amber);animation:pulse 1s infinite}
.dot.err{background:var(--rose)} .dot.local{background:var(--mut)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.gear{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;color:var(--mut)}
.gear:active{background:var(--card2)}
.gear svg{width:20px;height:20px}

/* ===== main / panels ===== */
main{padding:16px 16px 4px}
.sec-h{display:flex;align-items:center;gap:8px;margin:4px 2px 12px}
.sec-h .star{width:14px;height:14px;background:var(--coral);clip-path:var(--star);flex-shrink:0}
.sec-h h2{font-family:var(--slab);font-size:14px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--coral);white-space:nowrap}
.sec-h .right{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.card-h h3{font-family:var(--slab);font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt)}
.card-h .right{margin-left:auto}
.card-h .right button{font-size:12px;font-weight:700;color:var(--amber)}

/* ===== countdown / hero ===== */
.hero{position:relative;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:18px;margin-bottom:14px;background:#120d08}
.hero-art{position:relative;height:132px;background:
  linear-gradient(180deg,#F6CE6A 0%,#EC9C46 42%,#D26E36 74%,#9C4A2A 100%)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-body{padding:16px 18px 18px;text-align:center}
.hero-cap{font-family:var(--slab);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);font-weight:700}
.cd-row{display:flex;justify-content:center;gap:14px;margin-top:12px}
.cd-cell{min-width:52px}
.cd-n{font-family:var(--slab);font-size:34px;font-weight:700;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums}
.cd-l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut2);margin-top:5px}
.cd-done{font-family:var(--display);font-size:30px;font-weight:400;line-height:1.1;
  background:linear-gradient(90deg,var(--coral),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.cd-sub{font-size:12px;color:var(--mut);margin-top:8px}

/* ===== stats ===== */
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center}
.stat .v{font-family:var(--slab);font-size:22px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
.stat .l{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-top:4px}

/* ===== progress ===== */
.bar{height:8px;border-radius:8px;background:#0f0c08;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--coral),var(--amber));transition:width .4s}
.bar.teal i{background:linear-gradient(90deg,var(--teal2),var(--teal))}

/* ===== list items ===== */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#2a1400;transition:.12s;margin-top:1px}
.box.on{background:linear-gradient(135deg,var(--coral),var(--amber));border-color:transparent}
.it-body{flex:1;min-width:0}
.it-t{font-size:14.5px;font-weight:600;line-height:1.35}
.item.done .it-t{color:var(--mut2);text-decoration:line-through}
.it-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.it-meta .due{font-size:11px;color:var(--mut)}
.it-meta .due.soon{color:var(--amber);font-weight:700}
.who-tag{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.who-tag.Jason{color:var(--jason);border-color:rgba(230,164,60,.4)}
.who-tag.Ciara{color:var(--ciara);border-color:rgba(127,191,152,.4)}
.who-tag.Both,.who-tag.Joint{color:var(--mut)}
.x{color:var(--mut2);font-size:20px;padding:0 4px;flex-shrink:0;line-height:1}
.x:active{color:var(--rose)}

/* ===== money rows ===== */
.rec{display:flex;align-items:center;gap:11px;padding:12px 2px;border-top:1px solid var(--line)}
.rec:first-child{border-top:none}
.rec-ic{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--amber);font-size:15px}
.rec-main{flex:1;min-width:0}
.rec-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.rec-amt{font-family:var(--slab);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

.settle{background:linear-gradient(180deg,rgba(127,191,152,.10),transparent);border-color:rgba(127,191,152,.28)}
.settle .big{font-family:var(--slab);font-size:20px;font-weight:700;color:var(--teal)}
.settle .even{color:var(--teal);font-weight:700;font-size:16px}

/* goals */
.goal{padding:12px 2px;border-top:1px solid var(--line)}
.goal:first-child{border-top:none}
.goal-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.goal-t{font-size:14px;font-weight:700;flex:1}
.goal-n{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.goal-acts{display:flex;gap:8px;margin-top:9px}
.goal-acts button{font-size:12px;font-weight:700;color:var(--amber);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px}

/* big editable number */
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kv .lbl{font-size:12px;color:var(--mut)}
.kv .num{font-family:var(--slab);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.tap{border-bottom:1px dashed var(--mut2)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--txt)}
.chip .plus{color:var(--amber);font-weight:800;font-size:15px}
.chip:active{border-color:var(--amber)}
.chip.on{border-color:var(--amber);color:var(--amber)}

/* hero adventures */
.adv-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(217,118,62,.22),rgba(230,164,60,.06));border-color:rgba(217,118,62,.32)}
.adv-hero h3{font-family:var(--display);font-size:19px;font-weight:400;line-height:1.2;text-transform:none;letter-spacing:0}
.adv-hero p{margin:8px 0 0;font-size:13px;color:#efe7d8;line-height:1.55}
.adv-sun{position:absolute;top:-30px;right:-14px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,var(--amber),transparent 70%);opacity:.5}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:13px;font-weight:700;font-size:14px;letter-spacing:.2px;transition:.12s;border:1px solid var(--line)}
.btn:active{transform:scale(.985)}
.btn-go{background:linear-gradient(135deg,var(--coral),var(--amber));color:#2a1400;border:none}
.btn-ghost{background:var(--card2);color:var(--txt)}
.btn svg{width:17px;height:17px}
.empty{text-align:center;color:var(--mut2);font-size:13px;padding:18px 10px 6px}

/* ===== us tab ===== */
.checkin-grid{display:flex;gap:10px}
.checkin-col{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px}
.checkin-col h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.checkin-col.j h4{color:var(--jason)} .checkin-col.c h4{color:var(--ciara)}
.checkin-line{font-size:12.5px;line-height:1.5;margin:6px 0;color:var(--txt)}
.checkin-line b{color:var(--mut);font-weight:700;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;display:block}
.checkin-line.dim{color:var(--mut2);font-style:italic}
.mem{padding:11px 2px;border-top:1px solid var(--line)}
.mem:first-child{border-top:none}
.mem-t{font-size:14px;line-height:1.45}
.mem-meta{font-size:11px;color:var(--mut2);margin-top:4px}
.notepin{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}
.notepin .from{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
.notepin.j .from{color:var(--jason)} .notepin.c .from{color:var(--ciara)}
.notepin .txt{font-size:14px;line-height:1.5;font-style:italic}
.notepin .when{font-size:10.5px;color:var(--mut2);margin-top:6px}

/* ===== nav ===== */
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;display:flex;z-index:50;
  background:rgba(21,17,12,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:12px;color:var(--mut);transition:.15s}
.tab svg{width:21px;height:21px}
.tab .lb{font-size:9.5px;font-weight:700;letter-spacing:.2px}
.tab.active{color:var(--amber)}
.tab.active .lb{color:var(--amber)}

/* ===== fields / forms ===== */
.field{margin-bottom:12px}
.flab{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--coral)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}
.seg button.on[data-v="Jason"]{color:var(--jason)} .seg button.on[data-v="Ciara"]{color:var(--ciara)}

/* ===== modal ===== */
.modal{position:fixed;inset:0;background:rgba(8,6,4,.66);display:flex;align-items:flex-end;justify-content:center;z-index:90;backdrop-filter:blur(3px)}
.modal-card{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:rise .22s}
@keyframes rise{from{transform:translateY(34px)}to{transform:none}}
.modal-h{display:flex;align-items:center;margin-bottom:16px}
.modal-h h3{font-family:var(--display);font-size:19px;font-weight:400}
.modal-h .close{margin-left:auto;color:var(--mut);font-size:24px;padding:0 4px;line-height:1}
.note{font-size:12px;color:var(--mut);line-height:1.5;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:2px 0 12px}
.note b{color:var(--amber)}
.test-out{font-size:12px;font-weight:600;margin-top:8px;min-height:16px}

/* ===== who overlay ===== */
.who{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:26px;
  background:radial-gradient(120% 60% at 50% 0,rgba(217,118,62,.22),transparent 60%),linear-gradient(180deg,#271c11,#15110c)}
.who-card{max-width:360px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px}
.who-sun{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle,var(--amber),var(--coral) 72%);box-shadow:0 0 48px rgba(217,118,62,.5)}
.who-card h2{font-family:var(--display);font-size:22px;font-weight:400}
.who-card p{color:var(--mut);font-size:13.5px;margin:10px 0 20px;line-height:1.5}
.who-btns{display:flex;gap:12px}
.who-btns .btn{font-size:16px;padding:16px}

/* ===== toast ===== */
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(16px);background:#2a2218;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Jason <span class="amp">&amp;</span> Ciara</div>
    <div class="hdr-right">
      <button class="syncpill" data-act="settings"><span class="dot local" id="syncdot"></span><span id="synctxt">On this phone</span></button>
      <button class="gear" data-act="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
/* ============ helpers ============ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function fmtMoney(n){n=+n||0;return "$"+(Math.round(n*100)/100).toLocaleString("en-CA",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});}
function fmtDate(ts){var d=new Date(ts);return d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});}
function fmtDay(iso){if(!iso)return "";var p=iso.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"});}
function daysBetween(aIso,b){if(!aIso)return null;var p=aIso.split("-");var a=new Date(+p[0],+p[1]-1,+p[2]);var d=new Date(b);var b0=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((b0.getTime()-a.getTime())/86400000);}
function daysUntil(iso){if(!iso)return null;var p=iso.split("-");var t=new Date();var a=new Date(+p[0],+p[1]-1,+p[2]);var t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a.getTime()-t0.getTime())/86400000);}
function weekKey(ts){var d=new Date(ts);var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

/* ============ state ============ */
var SKEY="yj_state_v2";
var DEF={
  v:2, seeded:0,
  couple:{anniversary:"",arrived:"2026-06-23",moveIn:"2026-07-14",moveLabel:"We get the keys to Bridgeland",up:1},
  milestones:[], adventures:[], expenses:[], goals:[], contribs:[], memories:[], checkins:[], notes:[], dates:[]
};
var S=load();
function load(){
  try{var s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.v)return s;}catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}

/* seeds use FIXED ids so two phones seeding independently merge clean */
function seed(){
  if(S.seeded)return;
  S.seeded=1;
  var t=1;
  S.milestones=[
    {id:"sm1",t:"IKEA run: build the Bridgeland nest",who:"Both",cat:"now",due:"2026-07-15",done:0,up:t},
    {id:"sm2",t:"Internet + utilities set up at the new place",who:"Jason",cat:"now",due:"2026-07-16",done:0,up:t},
    {id:"sm3",t:"Address change: banks, CRA, phone plans",who:"Both",cat:"now",due:"2026-07-21",done:0,up:t},
    {id:"sm4",t:"Register with a family doctor / walk-in clinic",who:"Both",cat:"now",due:"",done:0,up:t},
    {id:"sm5",t:"Jason lands the right Calgary role",who:"Jason",cat:"now",due:"",done:0,up:t},
    {id:"sm6",t:"Ciara picks her next move (and goes for it)",who:"Ciara",cat:"now",due:"",done:0,up:t},

/* ============ merge (two-phone sync) ============ */
var COLLS=["milestones","adventures","expenses","goals","contribs","memories","checkins","notes","dates"];
function mergeColl(a,b){
  var map={};
  (a||[]).forEach(function(x){if(x&&x.id)map[x.id]=x;});
  (b||[]).forEach(function(x){
    if(!x||!x.id)return;
    var cur=map[x.id];
    if(!cur||(x.up||0)>(cur.up||0))map[x.id]=x;
  });
  return Object.keys(map).map(function(k){return map[k];});
}
function mergeState(local,remote){
  if(!remote||!remote.v)return local;
  var out=JSON.parse(JSON.stringify(local));
  COLLS.forEach(function(c){out[c]=mergeColl(local[c],remote[c]);});
  if((remote.couple&&remote.couple.up||0)>(local.couple&&local.couple.up||0))out.couple=remote.couple;
  out.seeded=local.seeded||remote.seeded||0;
  return out;
}
function alive(arr){return (arr||[]).filter(function(x){return x&&!x.del;});}

/* ============ sync engine ============ */
var WORKER="https://ladsbuster-data.dalyjason1.workers.dev/league?id=ourjourney_";
var room=localStorage.getItem("yj_room")||"";
var syncState="local", pushTimer=null, pollTimer=null, lastPush=0, dirty=0;
function setSync(st,txt){
  syncState=st;
  var d=$("syncdot"),x=$("synctxt");
  if(d)d.className="dot "+(st==="ok"?"ok":st==="sync"?"sync":st==="err"?"err":"local");
  if(x)x.textContent=txt||(st==="ok"?"Synced":st==="sync"?"Syncing…":st==="err"?"Sync hiccup":"On this phone");
}
function cloudUrl(){return WORKER+encodeURIComponent(room);}
function push(){
  if(!room)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    setSync("sync");
    fetch(cloudUrl(),{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({type:"wallets",players:[],wallets:{},blob:S})})
      .then(function(r){return r.json();})
      .then(function(){dirty=0;setSync("ok");lastPush=now();})
      .catch(function(){setSync("err");});
  },1400);
}
function pull(showToast){
  if(!room)return Promise.resolve(false);
  setSync("sync");
  return fetch(cloudUrl()).then(function(r){return r.json();}).then(function(j){
    var remote=j&&j.blob;
    var ahead=false;
    if(remote&&remote.v){
      var merged=mergeState(S,remote);
      var changed=JSON.stringify(merged)!==JSON.stringify(S);
      ahead=JSON.stringify(merged)!==JSON.stringify(remote);
      S=merged;persist();
      if(changed){render();if(showToast)toast("Pulled the latest from you two ☁️");}
    }
    if(ahead||dirty){push();}else{setSync("ok");}
    return true;
  }).catch(function(){setSync("err");return false;});
}
function startPolling(){
  clearInterval(pollTimer);
  if(!room)return;
  pollTimer=setInterval(function(){if(document.visibilityState==="visible")pull(false);},25000);
}
function touch(){dirty=1;persist();push();}

/* ============ money math ============ */
/* expense: {id,t,amt,paidBy,split:"half"|"forOther"|"settle",ts,up}
   half: payer covered a shared thing -> other owes half
   forOther: payer covered something purely for the other -> other owes all
   settle: payer paid the other back amt (reduces payer's debt) */
function settleCalc(expenses){
  var ciaraOwesJason=0;
  alive(expenses).forEach(function(e){
    var amt=+e.amt||0;
    if(e.split==="settle"){
      if(e.paidBy==="Ciara")ciaraOwesJason-=amt;else ciaraOwesJason+=amt;
      return;
    }
    var share=e.split==="forOther"?amt:amt/2;
    if(e.paidBy==="Jason")ciaraOwesJason+=share;else ciaraOwesJason-=share;
  });
  return Math.round(ciaraOwesJason*100)/100;
}

function goalSaved(g){
  var t=+g.saved||0;
  alive(S.contribs).forEach(function(c){if(c.goalId===g.id)t+=+c.amt||0;});
  return Math.max(0,Math.round(t*100)/100);
}

function nextEvent(){
  var cands=[];
  var c=S.couple;
  if(c.moveIn&&daysUntil(c.moveIn)>=0)cands.push({label:c.moveLabel||"Moving day",date:c.moveIn});
  if(c.anniversary){
    var p=c.anniversary.split("-");var t=new Date();
    var nx=new Date(t.getFullYear(),+p[1]-1,+p[2]);
    var t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    if(nx<t0)nx=new Date(t.getFullYear()+1,+p[1]-1,+p[2]);
    var iso=nx.getFullYear()+"-"+String(nx.getMonth()+1).padStart(2,"0")+"-"+String(nx.getDate()).padStart(2,"0");
    var yrs=nx.getFullYear()-(+p[0]);
    cands.push({label:(yrs<=0?"Our anniversary":yrs+(yrs===1?" year":" years")+" of us"),date:iso});
  }
  alive(S.dates).forEach(function(d){if(d.date&&daysUntil(d.date)>=0)cands.push({label:d.t,date:d.date});});
  cands=cands.filter(function(x){return daysUntil(x.date)>=0;});
  cands.sort(function(a,b){return daysUntil(a.date)-daysUntil(b.date);});
  return cands[0]||null;
}

    '<div class="checkin-grid">'+col("Jason",me==="Jason"?mine:theirs,me==="Jason")+col("Ciara",me==="Ciara"?mine:theirs,me==="Ciara")+'</div>'+
    '<div class="muted" style="font-size:11.5px;margin-top:9px">Rose = best bit · Thorn = hardest bit · Bud = what you’re looking forward to</div></div>';
  var notes=alive(S.notes).sort(function(a,b){return b.ts-a.ts;});
  var jn=notes.filter(function(n){return n.who==="Jason";})[0];
  var cn=notes.filter(function(n){return n.who==="Ciara";})[0];
  h+='<div class="card"><div class="card-h"><h3>Notes on the fridge</h3><div class="right"><button data-act="add-note">leave one</button></div></div>'+
    (jn?'<div class="notepin j"><div class="from">From Jason <button class="x" style="font-size:14px;float:right" data-act="del-note" data-id="'+jn.id+'">×</button></div><div class="txt">“'+esc(jn.t)+'”</div><div class="when">'+fmtDate(jn.ts)+'</div></div>':"")+
    (cn?'<div class="notepin c"><div class="from">From Ciara <button class="x" style="font-size:14px;float:right" data-act="del-note" data-id="'+cn.id+'">×</button></div><div class="txt">“'+esc(cn.t)+'”</div><div class="when">'+fmtDate(cn.ts)+'</div></div>':"")+
    (!jn&&!cn?'<div class="empty">Little love notes live here.</div>':"")+'</div>';
  var mems=alive(S.memories).sort(function(a,b){return b.ts-a.ts;}).slice(0,20);
  h+='<div class="card"><div class="card-h"><h3>Memory lane</h3><div class="right"><button data-act="add-memory">+ memory</button></div></div>'+
    (mems.length?mems.map(function(m2){
      return '<div class="mem"><div class="mem-t">'+esc(m2.t)+'</div><div class="mem-meta">'+esc(m2.who)+' · '+fmtDate(m2.ts)+
        ' <button class="x" style="font-size:14px" data-act="del-mem" data-id="'+m2.id+'">×</button></div></div>';
    }).join(""):'<div class="empty">First memory goes here. Make it a good one.</div>')+'</div>';
  return h;
}

/* ============ nav + render ============ */
var TABS=[["today","Today",IC.home],["plans","Plans",IC.map],["money","Money",IC.cash],["fun","Fun",IC.spark],["us","Us",IC.heart]];
function render(){
  var m=$("main");if(!m)return;
  m.innerHTML=tab==="plans"?viewPlans():tab==="money"?viewMoney():tab==="fun"?viewFun():tab==="us"?viewUs():viewToday();
  var n=$("nav");
  if(n)n.innerHTML=TABS.map(function(t){
    return '<button class="tab'+(tab===t[0]?" active":"")+'" data-act="tab" data-v="'+t[0]+'">'+t[2]+'<span class="lb">'+t[1]+'</span></button>';
  }).join("");
}

/* ============ modals ============ */
function mAddMilestone(){
  modal("Add to the plan",
    '<div class="field"><label class="flab">What is it?</label><input id="f-t" placeholder="e.g. Book the U-Haul"></div>'+
    '<div class="field"><label class="flab">Whose?</label>'+segHtml("who",["Jason","Ciara","Both"],me||"Both")+'</div>'+
    '<div class="field"><label class="flab">Horizon</label>'+segHtml("cat",["now","year","someday"],"now")+'</div>'+
    '<div class="field"><label class="flab">Due (optional)</label><input id="f-due" type="date"></div>'+
    '<button class="btn btn-go" data-act="save-milestone">Add it</button>');
}
function mAddAdventure(){
  modal("Add an adventure",
    '<div class="field"><label class="flab">The dream</label><input id="f-t" placeholder="e.g. Ice skate at Bowness Park"></div>'+
    '<div class="field"><label class="flab">Type</label>'+segHtml("tag",["date","trip","food","big"],"date")+'</div>'+
    '<button class="btn btn-go" data-act="save-adventure">On the list</button>');
}

    '<div class="field"><label class="flab">What was it?</label><input id="f-t" placeholder="e.g. Groceries"></div>'+
    '<div class="field"><label class="flab">Amount (CAD)</label><input id="f-amt" type="number" inputmode="decimal" placeholder="0.00"></div>'+
    '<div class="field"><label class="flab">Who paid?</label>'+segHtml("paidBy",["Jason","Ciara"],me||"Jason")+'</div>'+
    '<div class="field"><label class="flab">Split</label>'+segHtml("split",["half","forOther"],"half")+'</div>'+
    '<div class="note">“half” = shared thing, the other owes half. “forOther” = you covered something purely for them.</div>'+
    '<button class="btn btn-go" data-act="save-expense">Log it</button>');
}
function mAddGoal(){
  modal("New dream fund",
    '<div class="field"><label class="flab">Fund name</label><input id="f-t" placeholder="e.g. Home with land"></div>'+
    '<div class="field"><label class="flab">Target (CAD)</label><input id="f-amt" type="number" inputmode="decimal" placeholder="10000"></div>'+
    '<button class="btn btn-go" data-act="save-goal">Start the fund</button>');
}
function mAddMemory(){

    '<div class="field"><label class="flab">What happened?</label><textarea id="f-t" rows="3" placeholder="e.g. First Stampede. Ciara won at the ring toss."></textarea></div>'+
    '<button class="btn btn-go" data-act="save-memory">Keep it forever</button>');
}
function mAddNote(){
  modal("Note for "+esc(other()||"them"),
    '<div class="field"><textarea id="f-t" rows="3" placeholder="Something small and lovely."></textarea></div>'+
    '<button class="btn btn-go" data-act="save-note">Pin it to the fridge</button>');
}

  modal("Your weekly check-in",

    '<div class="field"><label class="flab">Anniversary (first date!)</label><input id="f-ann" type="date" value="'+esc(c.anniversary||"")+'"></div>'+
    '<div class="field"><label class="flab">Landed in Canada</label><input id="f-arr" type="date" value="'+esc(c.arrived||"")+'"></div>'+
    '<div class="row2"><div class="field"><label class="flab">Next big day</label><input id="f-move" type="date" value="'+esc(c.moveIn||"")+'"></div>'+
    '<div class="field"><label class="flab">What is it?</label><input id="f-movelab" value="'+esc(c.moveLabel||"")+'" placeholder="e.g. Keys day"></div></div>'+

function mSettings(){
  modal("Settings",
    '<div class="note"><b>Sync for two phones.</b> Pick a secret room code together (like a shared password) and enter the same code on both phones. Make it long and unguessable, anyone who knows the code could read this data.</div>'+
    '<div class="field"><label class="flab">Room code</label><input id="f-room" value="'+esc(room)+'" placeholder="e.g. corkto-calgary-4722" autocapitalize="none"></div>'+
    '<button class="btn btn-go" data-act="save-room">Connect</button>'+
    '<div class="test-out" id="test-out"></div>'+
    '<div style="height:10px"></div>'+
    '<button class="btn btn-ghost" data-act="edit-dates">Our dates (anniversary, countdown)</button>'+
    '<div style="height:10px"></div>'+
    '<div class="row2">'+
    '<button class="btn btn-ghost" data-act="export">Export backup</button>'+
    '<button class="btn btn-ghost" data-act="import">Import</button></div>'+
    '<input id="f-file" type="file" accept="application/json" style="display:none">'+
    '<div style="height:10px"></div>'+
    '<button class="btn btn-ghost" data-act="switch-who">I’m '+esc(other()||"the other one")+', actually</button>');
}

/* ============ actions ============ */
function markDel(coll,id){
  var arr=S[coll];
  for(var i=0;i<arr.length;i++)if(arr[i].id===id){arr[i]={id:id,del:1,up:now()};break;}
  touch();render();
}
function findIn(coll,id){var arr=S[coll];for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}

document.addEventListener("click",function(e){
  var el=e.target;
  while(el&&el!==document.body&&!(el.getAttribute&&el.getAttribute("data-act"))){
    if(el.getAttribute&&el.getAttribute("data-stop")){/* click inside modal card: only bg closes */}
    el=el.parentNode;
  }
  if(!el||el===document.body||!el.getAttribute)return;
  var act=el.getAttribute("data-act"),id=el.getAttribute("data-id"),v=el.getAttribute("data-v");

  /* seg toggle */
  if(el.parentNode&&el.parentNode.getAttribute&&el.parentNode.getAttribute("data-seg")){
    var sib=el.parentNode.querySelectorAll("button");
    for(var i=0;i<sib.length;i++)sib[i].classList.remove("on");
    el.classList.add("on");
    return;
  }

  switch(act){
    case "tab": tab=v;localStorage.setItem("yj_tab",v);render();window.scrollTo(0,0);break;
    case "go-plans": tab="plans";localStorage.setItem("yj_tab",tab);render();window.scrollTo(0,0);break;
    case "settings": mSettings();break;
    case "close-modal": closeModal();break;
    case "modal-bg": if(e.target===el)closeModal();break;

    case "who-pick":
      me=v;localStorage.setItem("yj_who",v);
      var w=document.querySelector(".who");if(w)w.remove();
      toast("Howdy, "+v+" \u{1F920}");render();
      if(!room)mSettings();break;
    case "switch-who":
      me=other();localStorage.setItem("yj_who",me);closeModal();toast("Howdy, "+me+" \u{1F920}");render();break;

    case "add-milestone": mAddMilestone();break;
    case "save-milestone":{
      var t1=($("f-t")&&$("f-t").value||"").trim();if(!t1){toast("Give it a name");break;}
      S.milestones.push({id:uid(),t:t1,who:segVal("who")||"Both",cat:segVal("cat")||"now",due:$("f-due")&&$("f-due").value||"",done:0,up:now()});
      touch();closeModal();render();toast("On the plan ✓");break;}
    case "toggle-ms":{
      var m1=findIn("milestones",id);if(m1){m1.done=m1.done?0:1;m1.up=now();touch();render();if(m1.done)toast("Yeehaw! \u{1F920}");}break;}
    case "del-ms":{var dm=findIn("milestones",id);if(dm&&confirm('Remove "'+dm.t+'" for both of you?'))markDel("milestones",id);break;}

    case "add-adventure": mAddAdventure();break;
    case "save-adventure":{
      var t2=($("f-t")&&$("f-t").value||"").trim();if(!t2){toast("Give it a name");break;}
      S.adventures.push({id:uid(),t:t2,tag:segVal("tag")||"date",done:0,note:"",up:now()});
      touch();closeModal();if(tab!=="fun"){tab="fun";localStorage.setItem("yj_tab",tab);}render();toast("Dream logged ✨");break;}
    case "toggle-adv":{
      var a1=findIn("adventures",id);if(a1){a1.done=a1.done?0:1;a1.up=now();touch();render();if(a1.done)toast("Adventure complete! \u{1F3C6}");}break;}
    case "del-adv":{var da=findIn("adventures",id);if(da&&confirm('Remove "'+da.t+'" for both of you?'))markDel("adventures",id);break;}
    case "adv-filter": advFilter=v;render();break;
    case "spin":{
      var pool=alive(S.adventures).filter(function(a){return !a.done;});
      if(!pool.length){toast("List's empty, add some adventures first!");break;}
      var pick=pool[Math.floor(Math.random()*pool.length)];
      modal("Tonight’s pick",'<div class="ctr" style="padding:8px 4px 4px">'+
        '<div style="font-size:40px;margin-bottom:10px">\u{1F3AF}</div>'+
        '<div style="font-family:var(--display);font-size:22px;line-height:1.3">'+esc(pick.t)+'</div>'+
        '<p class="muted" style="font-size:13px;margin:12px 0 18px">Drawn from your list. No backing out now.</p>'+
        '<button class="btn btn-go" data-act="close-modal">We’re doing it</button>'+
        '<div style="height:8px"></div>'+
        '<button class="btn btn-ghost" data-act="spin">Draw again</button></div>');
      break;}

    case "add-expense": mAddExpense();break;
    case "save-expense":{
      var t3=($("f-t")&&$("f-t").value||"").trim();
      var amt=parseFloat($("f-amt")&&$("f-amt").value);
      if(!t3||!(amt>0)){toast("Name it and give it an amount");break;}
      S.expenses.push({id:uid(),t:t3,amt:Math.round(amt*100)/100,paidBy:segVal("paidBy")||"Jason",split:segVal("split")||"half",ts:now(),up:now()});
      touch();closeModal();if(tab!=="money"){tab="money";localStorage.setItem("yj_tab",tab);}render();toast("Logged \u{1F9FE}");break;}
    case "del-exp":{
      var de=findIn("expenses",id);if(!de)break;
      var stl=alive(S.expenses).filter(function(x){return x.split==="settle";});
      var newest=stl.length?Math.max.apply(null,stl.map(function(x){return x.ts||0;})):0;
      var dmsg=de.split!=="settle"&&(de.ts||0)<newest?
        'This was part of an already-settled balance. Deleting it will shift who owes whom. Delete anyway?':
        'Remove "'+de.t+'" for both of you?';
      if(confirm(dmsg))markDel("expenses",id);
      break;}
    case "settle-up":{
      var bal=settleCalc(S.expenses);
      if(Math.abs(bal)<0.01)break;
      var payer=bal>0?"Ciara":"Jason";
      var sid="settle_"+weekKey(now())+"_"+Math.round(Math.abs(bal)*100);
      if(findIn("expenses",sid)){toast("Already marked settled");break;}
      S.expenses.push({id:sid,t:"Settled up",amt:Math.abs(bal),paidBy:payer,split:"settle",ts:now(),up:now()});
      touch();render();toast("All square \u{1F91D}");break;}

    case "add-goal": mAddGoal();break;
    case "save-goal":{
      var t4=($("f-t")&&$("f-t").value||"").trim();
      var tgt=parseFloat($("f-amt")&&$("f-amt").value);
      if(!t4||!(tgt>0)){toast("Name it and set a target");break;}
      S.goals.push({id:uid(),t:t4,target:Math.round(tgt),saved:0,up:now()});
      touch();closeModal();render();toast("Fund started \u{1F331}");break;}
    case "fund":{
      var g1=findIn("goals",id);if(g1){S.contribs.push({id:uid(),goalId:id,amt:+el.getAttribute("data-amt")||0,up:now()});touch();render();}break;}
    case "fund-custom":{
      var g2=findIn("goals",id);if(!g2)break;
      modal("Add to "+esc(g2.t),
        '<div class="field"><label class="flab">Amount (CAD, negative to take out)</label><input id="f-amt" type="number" inputmode="decimal" placeholder="100"></div>'+
        '<button class="btn btn-go" data-act="save-fund" data-id="'+g2.id+'">Add it</button>');
      break;}
    case "save-fund":{
      var add=parseFloat($("f-amt")&&$("f-amt").value);
      if(isNaN(add)||add===0){toast("Give me a number");break;}
      S.contribs.push({id:uid(),goalId:id,amt:Math.round(add*100)/100,up:now()});
      touch();closeModal();render();toast("Fund updated \u{1F331}");break;}
    case "del-goal":{var dg=findIn("goals",id);if(dg&&confirm('Remove the "'+dg.t+'" fund for both of you?'))markDel("goals",id);break;}

    case "add-memory": mAddMemory();break;
    case "save-memory":{
      var t5=($("f-t")&&$("f-t").value||"").trim();if(!t5){toast("Write something first");break;}
      S.memories.push({id:uid(),t:t5,who:me||"Both",ts:now(),up:now()});
      touch();closeModal();if(tab!=="us"){tab="us";localStorage.setItem("yj_tab",tab);}render();toast("Kept forever ❤️");break;}
    case "del-mem":{if(confirm("Remove this memory for both of you?"))markDel("memories",id);break;}

    case "add-note": mAddNote();break;
    case "save-note":{
      var t6=($("f-t")&&$("f-t").value||"").trim();if(!t6){toast("Write something first");break;}
      S.notes.push({id:uid(),t:t6,who:me||"Jason",ts:now(),up:now()});
      touch();closeModal();if(tab!=="us"){tab="us";localStorage.setItem("yj_tab",tab);}render();toast("Pinned \u{1F4CC}");break;}

    case "del-note":{if(confirm("Take this note off the fridge?"))markDel("notes",id);break;}
    case "do-checkin": mCheckin();break;
    case "save-checkin":{
      var wk=weekKey(now());
      var exist=alive(S.checkins).filter(function(c){return c.wk===wk&&c.who===me;})[0];
      var rose=($("f-rose")&&$("f-rose").value||"").trim(),
          thorn=($("f-thorn")&&$("f-thorn").value||"").trim(),
          bud=($("f-bud")&&$("f-bud").value||"").trim();
      if(!rose&&!thorn&&!bud){toast("Give me at least one");break;}
      if(exist){exist.rose=rose;exist.thorn=thorn;exist.bud=bud;exist.up=now();}
      else S.checkins.push({id:"ck_"+wk+"_"+(me||"Jason"),wk:wk,who:me||"Jason",rose:rose,thorn:thorn,bud:bud,up:now()});
      touch();closeModal();render();toast("Shared ❤️");break;}

    case "edit-dates": mDates();break;
    case "save-dates":{
      S.couple.anniversary=$("f-ann")&&$("f-ann").value||"";
      S.couple.arrived=$("f-arr")&&$("f-arr").value||S.couple.arrived;
      S.couple.moveIn=$("f-move")&&$("f-move").value||"";
      S.couple.moveLabel=($("f-movelab")&&$("f-movelab").value||"").trim()||"The next big day";
      S.couple.up=now();
      touch();closeModal();render();toast("Dates saved");break;}

    case "save-room":{
      var r=($("f-room")&&$("f-room").value||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
      var out=$("test-out");
      var typed=($("f-room")&&$("f-room").value||"").trim();
      if(!r){room="";localStorage.removeItem("yj_room");setSync("local");clearInterval(pollTimer);if(out){out.textContent="Sync off, staying on this phone only.";out.style.color="var(--mut)";}break;}
      room=r;localStorage.setItem("yj_room",r);
      startPolling();
      if(out){out.textContent=(typed.toLowerCase()!==r?"(Code simplified to "+r+".) ":"")+"Connecting…";out.style.color="var(--amber)";}
      fetch(cloudUrl()).then(function(resp){return resp.json();}).then(function(j){
        var remote=j&&j.blob;
        if(remote&&remote.v){
          var n1=alive(remote.milestones).length,n2=alive(remote.expenses).length,n3=alive(remote.memories).length;
          S=mergeState(S,remote);persist();render();
          if(out){out.textContent="Joined! Found shared data here ("+n1+" plans, "+n2+" expenses, "+n3+" memories). Ye're linked.";out.style.color="var(--teal)";}
        }else{
          if(out){out.textContent="New room created. "+other()+" should enter this exact code, their phone will say Joined.";out.style.color="var(--teal)";}
        }
        dirty=1;push();
      }).catch(function(){
        if(out){out.textContent="Couldn't reach the cloud just now. It'll keep retrying in the background.";out.style.color="var(--rose)";}
        setSync("err");
      });
      break;}
    case "export":{
      try{
        var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
        var a2=document.createElement("a");a2.href=URL.createObjectURL(blob);a2.download="ourjourney-backup.json";a2.click();
      }catch(err){toast("Couldn't export");}
      break;}
    case "import":{var f=$("f-file");if(f)f.click();break;}
  }
});

document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="f-file"){
    var file=e.target.files[0];if(!file)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        if(o&&o.v){S=mergeState(S,o);persist();push();closeModal();render();toast("Backup merged in ✓");}
        else toast("That file doesn't look right");
      }catch(err){toast("Couldn't read that file");}
    };
    r.readAsText(file);
    e.target.value="";
  }
});

/* ============ boot ============ */
seed();
if(!me){
  var whoEl=document.createElement("div");
  whoEl.className="who";
  whoEl.innerHTML='<div class="who-card"><div class="who-sun"></div><h2>Well howdy.</h2>'+
    '<p>One little question so this phone knows whose boots these are.</p>'+
    '<div class="who-btns"><button class="btn btn-go" data-act="who-pick" data-v="Jason">Jason</button>'+
    '<button class="btn btn-go" style="background:linear-gradient(135deg,var(--teal2),var(--teal))" data-act="who-pick" data-v="Ciara">Ciara</button></div></div>';
  document.body.appendChild(whoEl);
}
render();
if(room){setSync("sync");pull(false);startPolling();}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&room)pull(false);
  if(document.visibilityState==="hidden")flushNow();
});
function flushNow(){
  if(!room||!dirty)return;
  try{
    clearTimeout(pushTimer);
    var payload=new Blob([JSON.stringify({type:"wallets",players:[],wallets:{},blob:S})],{type:"application/json"});
    if(navigator.sendBeacon&&navigator.sendBeacon(cloudUrl(),payload))dirty=0;
  }catch(e){}
}
window.addEventListener("pagehide",flushNow);
})();
</script>
